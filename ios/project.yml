# The Xcode project is generated from this file by XcodeGen, and .xcodeproj is
# NOT committed.
#
# A pbxproj is a machine-written file with UUIDs for every reference; two people
# adding a file produce a conflict nobody can read, and a review of one tells you
# nothing. This spec is the project: it is short, it diffs, and CI regenerates
# the real thing before every build.
name: MusicDRemote
options:
  bundleIdPrefix: com.musicd.lite
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    # Sideloading re-signs the app anyway — AltStore, SideStore and Sideloadly
    # all strip and replace whatever signature is here — so CI produces an
    # unsigned bundle rather than pretending to have a certificate.
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""

targets:
  MusicDRemote:
    type: application
    platform: iOS
    sources:
      - path: MusicDRemote/Sources
      # The front-end is not copied. It is the same directory the Android app
      # bundles, referenced as a folder so both platforms ship the same
      # 11,600 lines and neither can drift from the other.
      - path: ../app/src/main/assets/web
        type: folder
        buildPhase: resources
    info:
      path: MusicDRemote/Info.plist
      properties:
        CFBundleDisplayName: MusicD Remote
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Required from iOS 14 to talk to anything on the LAN. The Core is on
        # your own network, so this prompt is unavoidable and honest.
        NSLocalNetworkUsageDescription:
          MusicD Remote talks directly to your Roon Core on this network.
        # Asked for only when the microphone is used to find a record.
        NSSpeechRecognitionUsageDescription:
          Used to find an album or artist in your own library.
        NSMicrophoneUsageDescription:
          Used to find an album or artist in your own library.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.musicd.lite.remote
        TARGETED_DEVICE_FAMILY: "1,2"

  MusicDRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MusicDRemote/Tests
      # The shared wire fixtures ride along in the test bundle, so the test
      # reads them from itself rather than reaching back up into the checkout
      # for a path that only happens to be right on this machine.
      - path: ../tools/wire-fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: MusicDRemote

schemes:
  MusicDRemote:
    build:
      targets:
        MusicDRemote: all
        MusicDRemoteTests: [test]
    test:
      targets:
        - MusicDRemoteTests
