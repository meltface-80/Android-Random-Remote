name: Build

# The APK is built here rather than by hand: GitHub's runners already carry the
# Android SDK, so this is the shortest path from a commit to something
# installable. Every push produces an artifact; a tag also produces a release.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core:
    name: Core tests (JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # The protocol, library and API logic all live in :core, which is a plain
      # Kotlin/JVM module — so the part of the app most worth testing is tested
      # without an emulator or an Android SDK.
      - name: Run the core test suite
        timeout-minutes: 15
        run: ./gradlew :core:test --no-daemon --stacktrace

      - name: Check the wire format against node-roon-api
        run: |
          git clone --depth 1 https://github.com/RoonLabs/node-roon-api /tmp/node-roon-api
          node tools/verify-wire.js /tmp/node-roon-api

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: core/build/reports/tests/test

  apk:
    name: APK
    runs-on: ubuntu-latest
    needs: core
    # A build that hangs must fail with logs rather than sit until the six-hour
    # default expires: the logs are only retrievable once the job ends.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Install exactly what the build needs, here, where the download is
      # visible in the log — rather than leaving Gradle to fetch it mid-task
      # where a stall looks identical to a slow compile.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'tools platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble the release APK
        timeout-minutes: 25
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Name the artifact after the version
        id: name
        run: |
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          out="musicd-remote-lite-${version}.apk"
          cp "$apk" "$out"
          echo "apk=$out" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.apk }}
          path: ${{ steps.name.outputs.apk }}

      # Keep a directly downloadable APK in the repo, so the README can link
      # straight at it and sideloading is one tap rather than a trip through
      # the Actions UI.
      #
      # Committed once per versionName, not once per push: the APK is a build
      # output and git keeps every copy forever, so a 1.8 MB commit on every
      # push would bloat the history for nothing. Bumping versionName in
      # app/build.gradle.kts is what publishes a new one.
      #
      # This pushes with GITHUB_TOKEN, and GitHub deliberately does not fire
      # workflows for pushes made with it — so this cannot start a build loop.
      - name: Publish the APK into dist/
        if: github.event_name == 'push' && github.ref_type == 'branch'
        env:
          APK: ${{ steps.name.outputs.apk }}
        run: |
          set -euo pipefail
          if [ -f "dist/$APK" ]; then
            echo "dist/$APK is already committed — nothing to publish."
            exit 0
          fi
          mkdir -p dist
          # One APK in the tree at a time. The old one is superseded rather
          # than kept: the README links to a single file, and git still has
          # every previous version in its history.
          git rm -q --ignore-unmatch 'dist/musicd-remote-lite-*.apk'
          cp "$APK" "dist/$APK"
          # The README's download link is rewritten here rather than by hand,
          # because a link that has to be remembered is a link that eventually
          # points at a version that no longer exists.
          sed -i -E "s#dist/musicd-remote-lite-[0-9][^)\"]*\.apk#dist/$APK#g" README.md
          git add "dist/$APK" README.md
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish $APK" -m "Built from ${GITHUB_SHA}."
          # The branch may have moved while this job ran.
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Attach the APK to a tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.name.outputs.apk }}
