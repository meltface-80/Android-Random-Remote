name: Build

# The APK is built here rather than by hand: GitHub's runners already carry the
# Android SDK, so this is the shortest path from a commit to something
# installable. Every push produces an artifact; a tag also produces a release.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core:
    name: Core tests (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # The protocol, library and API logic all live in :core, which is a plain
      # Kotlin/JVM module — so the part of the app most worth testing is tested
      # without an emulator or an Android SDK.
      - name: Run the core test suite
        run: ./gradlew :core:test

      - name: Check the wire format against node-roon-api
        run: |
          git clone --depth 1 https://github.com/RoonLabs/node-roon-api /tmp/node-roon-api
          node tools/verify-wire.js /tmp/node-roon-api

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: core/build/reports/tests/test

  apk:
    name: APK
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble the release APK
        run: ./gradlew :app:assembleRelease

      - name: Name the artifact after the version
        id: name
        run: |
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          out="musicd-remote-lite-${version}.apk"
          cp "$apk" "$out"
          echo "apk=$out" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.apk }}
          path: ${{ steps.name.outputs.apk }}

      - name: Attach the APK to a tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.name.outputs.apk }}
